services:
  s3:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9002:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${AWS_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${AWS_SECRET_ACCESS_KEY}
    command: server /data --console-address ":9001"
    networks:
      - internal
      - public
    volumes:
      - minio_new_volume:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  mc_setup:
    image: minio/mc
    restart: "no"
    env_file:
      - .env
    networks:
      - internal
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo 'Waiting for MinIO...';
        sleep 5;
        mc alias set myminio http://s3:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY};
        mc mb --ignore-existing myminio/mlartifacts;
        mc policy set download myminio/mlartifacts;
        echo 'Bucket mlartifacts created and policy set.';
      "

  mlflow_db:
    image: postgres:16
    container_name: mlflow_db
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${MLFLOW_DB_USER}
      - POSTGRES_PASSWORD=${MLFLOW_DB_PASSWORD}
      - POSTGRES_DB=${MLFLOW_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - mlflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  app_db:
    image: postgres:16
    container_name: app_db
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${APP_DB_USER}
      - POSTGRES_PASSWORD=${APP_DB_PASSWORD}
      - POSTGRES_DB=${APP_DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  mlflow:
    build:
      context: ./docker
      dockerfile: mlflow.Dockerfile
    container_name: tracker_mlflow
    restart: unless-stopped
    ports:
      - "5050:5000"
    env_file:
      - .env
    networks:
      - public
      - internal
    depends_on:
      mlflow_db:
        condition: service_healthy
      mc_setup:
        condition: service_completed_successfully
    entrypoint: mlflow server --host 0.0.0.0 --artifacts-destination s3://mlartifacts --backend-store-uri postgresql://mlflow:mlflow@mlflow_db:5432/mlflow

  redis:
    image: redis:6.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - feast_net
  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: jupyter
    ports:
      - "8888:8888"
    volumes:
      - .:/home/jovyan/work
    command: >
      sh -c "pip install feast[redis] pandas scikit-learn &&
             start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''"
    networks:
      - feast_net

networks:
  feast_net:
    driver: bridge
  internal:
  public:
    driver: bridge

volumes:
  mlflow_postgres_data:
  postgres_data:
  minio_new_volume:
