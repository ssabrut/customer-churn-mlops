services:
  s3:
    image: minio/minio:latest
    restart: unless-stopped
    container_name: s3
    ports:
      - "9002:9000"
      - "9001:9001"
    env_file:
      - .env
    environment:
      - MINIO_ROOT_USER=${AWS_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${AWS_SECRET_ACCESS_KEY}
    command: server /data --console-address ":9001"
    networks:
      - internal
      - public
    volumes:
      - minio_new_volume:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  mc_setup:
    image: minio/mc
    container_name: mc_setup
    restart: "no"
    networks:
      - internal
    env_file:
      - .env
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo 'Waiting for MinIO...';
        sleep 5;
        mc alias set myminio http://s3:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY};
        mc mb --ignore-existing myminio/mlartifacts;
        mc policy set download myminio/mlartifacts;
        echo 'Bucket mlartifacts created and policy set.';
      "

  mlflow_postgres:
    image: postgres:16
    container_name: mlflow_postgres
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${MLFLOW_DB_USER}
      - POSTGRES_PASSWORD=${MLFLOW_DB_PASSWORD}
      - POSTGRES_DB=${MLFLOW_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - mlflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  app_postgres:
    image: postgres:16
    container_name: app_postgres
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${APP_DB_USER}
      - POSTGRES_PASSWORD=${APP_DB_PASSWORD}
      - POSTGRES_DB=${APP_DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER} -d ${APP_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  app_db_init:
    build:
      context: .
      dockerfile: Dockerfile
    image: churn-mlops-image:latest
    container_name: app_db_init
    command: python scripts/populate_db.py
    env_file:
      - .env
    networks:
      - internal
    depends_on:
      app_postgres:
        condition: service_healthy
    restart: "no"

  airflow_postgres:
    image: postgres:16
    container_name: airflow_postgres
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${AIRFLOW_DB_USER}
      - POSTGRES_PASSWORD=${AIRFLOW_DB_PASSWORD}
      - POSTGRES_DB=${AIRFLOW_DB_NAME}
    ports:
      - "5436:5432"
    volumes:
      - airflow_posstgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  airflow_init:
    image: apache/airflow:2.8.0
    container_name: airflow_init
    restart: "no"
    depends_on:
      airflow_postgres:
        condition: service_healthy
    entrypoint: /bin/sh
    env_file:
      - .env
    command: >
      -c "
        echo 'Waiting 5s for DB to be fully ready...';
        sleep 5;
        echo 'Initializing/Upgrading Airflow database...';
        airflow db upgrade;
        echo 'Creating Airflow admin user (if not exists)...';
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true;
        echo 'Initialization complete.';
      "
    networks:
      - internal

  airflow_webserver:
    image: apache/airflow:2.8.0
    container_name: airflow_webserver
    restart: always
    depends_on:
      airflow_init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    command: airflow webserver
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - internal
      - public

  airflow_scheduler:
    image: apache/airflow:2.8.0
    container_name: airflow_scheduler
    restart: always
    depends_on:
      airflow_init:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal
    command: airflow scheduler

  mlflow:
    build:
      context: ./docker
      dockerfile: mlflow.Dockerfile
    container_name: mlflow
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - MLFLOW_S3_ENDPOINT_URL=${MLFLOW_S3_ENDPOINT_URL}
    ports:
      - "5050:5000"
    networks:
      - public
      - internal
    depends_on:
      mlflow_postgres:
        condition: service_healthy
      mc_setup:
        condition: service_completed_successfully
    entrypoint: mlflow server --host 0.0.0.0 --artifacts-destination s3://mlartifacts --backend-store-uri postgresql://${MLFLOW_DB_USER}:${MLFLOW_DB_PASSWORD}@mlflow_postgres:5432/${MLFLOW_DB_NAME}

  redis:
    image: redis:6.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - feast_net
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastapi_server:
    build:
      context: .
      dockerfile: Dockerfile
    image: churn-mlops-image:latest
    container_name: fastapi_server
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - public
      - internal
    depends_on:
      app_db_init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started

  gradio_server:
    build:
      context: .
      dockerfile: docker/gradio.Dockerfile
    container_name: gradio_server
    command: python entrypoint/gradio_app.py
    restart: unless-stopped
    ports:
      - "7860:7860"
    networks:
      - internal
      - public
    env_file:
      - .env
    depends_on:
      fastapi_server:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - internal
    env_file:
      - .env
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped
    depends_on:
      - app_postgres
      - mlflow_postgres

networks:
  feast_net:
    driver: bridge
  internal:
    driver: bridge
  public:
    driver: bridge

volumes:
  airflow_posstgres_data:
  grafana_data:
  minio_new_volume:
  mlflow_postgres_data:
  postgres_data:
