version: "3.8"

services:
  mlflow-db:
    image: postgres:13
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_MLFLOW_USER}
      - POSTGRES_PASSWORD=${POSTGRES_MLFLOW_PASSWORD}
      - POSTGRES_DB=${POSTGRES_MLFLOW_DB}
    volumes:
      - mlflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_MLFLOW_USER} -d ${POSTGRES_MLFLOW_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    restart: always
    ports:
      - "9876:9876" # API
      - "9001:9001" # Console
    env_file:
      - .env
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9876/minio/health/live || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow-server:
    image: python:3.9-slim
    restart: always
    ports:
      - "5050:5050"
    env_file:
      - .env
    depends_on:
      mlflow-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "
        pip install mlflow boto3 psycopg2-binary &&
        mlflow server
        --host 0.0.0.0
        --port 5050
        --backend-store-uri postgresql://${POSTGRES_MLFLOW_USER}:${POSTGRES_MLFLOW_PASSWORD}@db:5432/${POSTGRES_MLFLOW_DB}
        --default-artifact-root s3://mlflow/
      "

volumes:
  mlflow_db_data:
  minio_data:
