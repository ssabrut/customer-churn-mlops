services:
  s3:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9002:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${AWS_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${AWS_SECRET_ACCESS_KEY}
    command: server /data --console-address ":9001"
    networks:
      - internal
      - public
    volumes:
      - minio_new_volume:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  mc-setup:
    image: minio/mc
    restart: "no"
    env_file:
      - .env
    networks:
      - internal
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo 'Waiting for MinIO...';
        sleep 5;
        mc alias set myminio http://s3:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY};
        mc mb --ignore-existing myminio/mlartifacts;
        mc policy set download myminio/mlartifacts;
        echo 'Bucket mlartifacts created and policy set.';
      "

  db:
    image: postgres:15
    container_name: mlflow_db
    restart: always
    environment:
      - POSTGRES_USER=mlflow
      - POSTGRES_PASSWORD=mlflow
      - POSTGRES_DB=mlflow
    ports:
      - "5432:5432"
    volumes:
      - mlflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  mlflow:
    build:
      context: ./docker
      dockerfile: mlflow.Dockerfile
    container_name: tracker_mlflow
    restart: unless-stopped
    ports:
      - "5050:5000"
    env_file:
      - .env
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://s3:9000
    networks:
      - public
      - internal
    depends_on:
      db:
        condition: service_healthy
      mc-setup:
        condition: service_completed_successfully
    entrypoint: mlflow server --host 0.0.0.0 --artifacts-destination s3://mlartifacts --backend-store-uri postgresql://mlflow:mlflow@db:5432/mlflow

networks:
  internal:
  public:
    driver: bridge

volumes:
  mlflow_postgres_data:
  minio_new_volume:
