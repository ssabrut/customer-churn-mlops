events {}

http {
    upstream backend {
        server fastapi_blue:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check for the Load Balancer itself
        location /health {
            return 200 'Nginx is Alive';
        }
    }
}